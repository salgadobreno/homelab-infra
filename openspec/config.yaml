schema: spec-driven

context: |
  ## What this project is

  Infrastructure-as-code for a single-host Proxmox VE homelab. The goal is twofold and
  both halves matter: run a genuinely professional setup, and build hands-on fluency in
  Terraform, Kubernetes, and ArgoCD for interview readiness. When the two conflict,
  prefer the industry-standard choice over the homelab-clever one — the operator needs
  to be able to explain each decision to an interviewer.

  ## Hardware and constraints

  Single host, `pve`, Proxmox VE 9.2.2 on Debian 13 (trixie), kernel 7.0.2.

  - AMD Ryzen 5 3400G, 4 cores / 8 threads. Not a bottleneck at this scale.
  - 13 GiB RAM total, ~3.2 GiB in use by the host. This is THE binding constraint —
    it decides cluster topology and rules out generous observability. Treat any design
    that needs more than ~10 GiB across all VMs as infeasible without justification.
  - 35 GiB swap. Means memory pressure shows up as slowness, not OOM kills — which is
    harder to diagnose, so state memory budgets explicitly rather than discovering them.
  - Two storage devices with different jobs. Storage location is never incidental:
    - **NVMe** (WD 240 GB, `nvme0n1`) — LVM volume group `pve`: `pve-root` 65.5 GiB
      (~49 GiB free), `pve-swap` 8 GiB, and a **129.8 GiB LVM-thin pool** (`pve-data`,
      exposed as `local-lvm`) that is currently empty. VM disks go here.
    - **HDD** (1 TB 7200rpm Barracuda, `sda`) — `/mnt/sda8`, 427 GiB at 86% used. Bulk
      and dump storage. Roughly 475 GiB more is reclaimable from a dead Windows install
      (`sda4` NTFS 246.8 GiB, `sda6` ext4 228.2 GiB and unmounted).
    - The Kubernetes datastore (sqlite, later etcd) is fsync-latency-bound. **Never put
      node disks or a datastore on the HDD** — the cluster will appear healthy and then
      fail under load with apiserver timeouts that look like network faults.
    - `df` cannot see the thin pool because it is not mounted. Use `lsblk` or `lvs`
      before drawing conclusions about free NVMe capacity.
    - Storage tiers: VM OS and datastore on `local-lvm`; fast ephemeral PVCs on k3s
      `local-path`; durable PVCs on an NFS export from `/mnt/sda8`. Only the NFS tier
      survives `tofu destroy`, so anything worth keeping belongs there.
    - NVMe health (SMART, 2026-08-19): 19% of endurance used, 100% spare, 0 integrity
      errors, 18.9 TB written across 35,625 power-on hours (~4 years). Endurance is not
      a constraint — a Prometheus TSDB would add roughly 10% to lifetime write volume.
      Do not treat wear as a reason to avoid write-heavy workloads on this drive.
    - **161 of 197 power cycles were unsafe shutdowns.** Abrupt power loss is this
      host's normal failure mode and there is no UPS. The disposable-cluster design
      absorbs this for anything declared in Git, but it is a real threat to etcd
      (from the multi-node milestone) and to any durable data on the NFS tier. Do not
      propose storing irreplaceable data without a backup story or a UPS.
    - Upgrade path: the NVMe is nearly fully allocated, so the thin pool cannot grow
      without another disk. Proxmox migrates VM disks between storages online, so a
      future second NVMe can be ZFS and the nodes moved onto it without a rebuild.
      Do not propose converting the current layout to ZFS — that means reinstalling
      Proxmox.
  - Ingress is a Cloudflare tunnel (`cloudflared`, running as an unprivileged service
    account on the host). It is
    outbound-only — there are no inbound port-forwards, and nothing should assume a
    public IP or inbound reachability.

  ## Networking and address plan

  LAN is `192.168.0.0/24`, gateway `192.168.0.1`, bridged to VMs via `vmbr0`.

  There is no local DNS. `/etc/resolv.conf` points at `8.8.8.8`, and `pve.lan` resolves
  only through a hand-maintained `/etc/hosts` entry. Do not assume LAN hostnames
  resolve — reference addresses, or propose standing up DNS as its own change.

  Addresses are allocated statically from this plan and declared in configuration.
  The router's DHCP pool starts at `.100` and is never allocated by this project.

  | Range | Use |
  |---|---|
  | `192.168.0.1`      | Router / gateway |
  | `192.168.0.21`     | Proxmox host `pve` (static, pre-existing) |
  | `192.168.0.30-.32` | k3s nodes — `.30` server, `.31`/`.32` agents |
  | `192.168.0.40-.50` | Reserved for LoadBalancer addresses (MetalLB, later) |
  | `192.168.0.100+`   | DHCP pool — do not allocate |

  Cluster nodes are statically addressed rather than using DHCP: there is no DNS to hide
  a moving address behind, and the destroy/recreate cycle this project depends on gives
  a rebuilt VM a fresh MAC and therefore a fresh lease. Before claiming an address, ping
  it. When adding a node, update this table in the same change.

  ## Milestone ladder

  The path. Each rung ends in something demonstrable, and one OpenSpec change delivers
  one rung. This is the authoritative numbering — `M<n>` anywhere in the repo means a row
  in this table.

  | # | Ends when the operator can say | Change | State |
  |---|---|---|---|
  | M0 | "`tofu plan` talks to my Proxmox API" | `bootstrap-k3s-node` (task 3.4) | done 2026-08-21 |
  | M1 | "One VM, built by OpenTofu, running k3s. `kubectl get nodes` works." | `bootstrap-k3s-node` | done 2026-08-21 |
  | M2 | "Every credential holds only what its job needs, and I can prove it." | `narrow-privileges` | done 2026-08-21 |
  | M3 | "I pushed to GitHub and ArgoCD served my site. I did not run kubectl." | `serve-site-from-k3s` | done 2026-08-22 |
  | M4 | "Docker-on-host is gone. The cluster serves buzaga.com.br." | `retire-compose-stack` | done 2026-08-22 |
  | M5 | "The site shows its own guts, and the picture cannot go stale." | not yet proposed | next |
  | M6 | "Three nodes. I drained one and the app stayed up." | not yet proposed | |
  | M7 | "I can see what the cluster is doing." — observability, if RAM allows | not yet proposed | |

  **The rebuild demo is not a rung.** `make rebuild CONFIRM=yes` destroying and recreating
  the node in ~105 seconds was the original ladder's M4 and the intended centrepiece. It
  arrived early, inside M1, and every rung since has used it as its acceptance test. It
  is the best thing to demonstrate; it is not work that remains.

  ### What M4 is, and what it deliberately does not do

  M4 is a cutover, not a migration. `buzaga.com.br` is repointed from the Compose stack
  to traefik, and the Compose stack is stopped. That is the whole rung.

  **The hit counter and Redis are retired, not ported.** Operator decision, 2026-08-21:
  porting them means a registry for a locally-built image and a persistence story for
  Redis — real work, for a component that is going away when this content moves into the
  personal site's `projects` section. Building it to delete it is the expensive path.

  Nothing breaks when they stop. `index.html` already degrades: *"If the API is down,
  hide the counters — the static site still works."* The cluster copy has served it that
  way since M3, so the behaviour after cutover is the behaviour already in production on
  the second hostname.

  A registry and durable storage are therefore **not M4 problems and not scheduled**.
  They arrive when a workload genuinely needs them, and that workload will make the case.

  **Retiring Compose must not take the site down.** `buzaga.com.br` stays served
  throughout — the milestone is the origin moving, not the site pausing. Repoint the
  hostname once the cluster copy serves the same thing, and stop Compose after, not
  before.

  **The before state has to be captured before it is destroyed.** M4 removes the last
  running example of the architecture this project exists to replace, so the old shape —
  nginx, hit-counter and Redis as Docker Compose on the hypervisor, with a live count of
  65 hits — is recorded as part of M4 rather than remembered. Two places, for two
  reasons: `README.md` as the evergreen record, since the site's own rendering of it is
  temporary and the README is what a reader arrives at; and the site itself, where it
  becomes the "before" half of what M5 shows.

  ### What M5 is, and why it is a rung rather than a page

  The public site renders the infrastructure it is running on, in a low-fi register —
  text and ASCII, no dashboard chrome. Nodes, workloads, what ArgoCD last synced and from
  which revision, the path a request took to arrive. A visitor sees the machine that
  served them.

  It shows **both halves**: what runs now, and the Compose-on-the-hypervisor arrangement
  it replaced. The delta is the point — a diagram of the current setup alone does not say
  what was learned, and the old shape is the thing an interviewer recognises.

  It is the project's demo. Everything before it is legible only by reading this
  repository; this rung is the one that shows the work to someone who will not.

  **The requirement that makes it engineering rather than content: the picture is
  generated from live state, never drawn.** `k8s/site/content/diagram.ascii` is the
  evidence — a hand-drawn diagram already in the repository showing `microk8s`, `ansible`
  and a host called `buserver`, none of which exist. It was accurate once. A diagram that
  can disagree with reality eventually will, and a self-describing site that lies is worse
  than no diagram at all.

  Two questions to settle when proposing it, both real forks:

  - **Where the data comes from.** A build-time snapshot rendered at sync is simple and is
    stale between syncs. Querying the Kubernetes API from the pod at request time is
    always current and needs a ServiceAccount with its own narrow RBAC — which is M2's
    argument applied inside the cluster, and the better exercise.
  - **What it must not say.** The page is public. Node addresses, storage layout, and
    account names are exactly what this repo spent M2 narrowing, and a page that shows its
    guts is an information-disclosure surface. Decide what is shown before building it,
    not after.

  Later this content moves into a `projects` section of the operator's personal site, so
  it should not assume it owns the whole page.

  ### Numbering history — read this before trusting an old document

  The ladder was reordered once. `narrow-privileges` was pulled forward from rung 6 to
  rung 2, because `CLAUDE.md` carried three recorded shortcuts "with a milestone to fix
  each" and that list drove the choice. The original rungs 2 and 3 (serve the site, then
  add ArgoCD) merged into one M3, since installing a reconciler without anything to
  reconcile is a layer rather than a slice.

  Archived changes under `openspec/changes/archive/` use the **original** numbering and
  are left untouched as historical record. In those documents M6 means secrets — that work
  is M2 here. M7 means observability in both schemes, and M5 means multi-node in the old
  scheme but is the self-describing site here. Everywhere outside the archive, this table
  is authoritative.

  ## Current state

  Proxmox runs one VM: `k3s-server-1` at 192.168.0.30, provisioned entirely from `tofu/`
  and rebuilt unattended in ~105 seconds. ArgoCD runs in it, installed by cloud-init as a
  k3s HelmChart, so a rebuilt cluster arrives already reconciling.

  The actual workload — nginx serving a placeholder site, a hit-counter, and redis — still
  runs as Docker Compose directly on the hypervisor from `/mnt/sda8/Projects/buzaga`,
  serving `buzaga.com.br`. That co-location is the known anti-pattern this project exists
  to fix; it was retired at M4. The site itself is disposable and may break — but it now
  depends on the cluster, so `make rebuild` is a public outage of about 190 seconds.

  ## Toolchain reality

  Installed: `docker`, `git`, `python3`.
  NOT installed: `tofu`, `terraform`, `ansible`, `kubectl`, `helm`, `k3s`, `argocd`,
  `sops`, `age`, `yamllint`. None of these come from Debian apt. Never invoke them
  speculatively — check with `command -v` first and say what is missing rather than
  inventing output.

  Proxmox CLI tools (`qm`, `pct`, `pvesm`) live in `/usr/sbin`, which is off the
  default PATH for the non-root operator. They also require root; the operator has
  sudo but commands should not assume it silently.

  ## What owns what

  `tofu/` provisions the node and installs ArgoCD as part of node bootstrap. `k8s/` holds
  what ArgoCD reconciles. The boundary is the directory, and it is worth keeping obvious:
  nothing in `k8s/` may need to exist before ArgoCD does, and no Kubernetes resource
  belongs in `tofu/`. The single exception is the bootstrap `Application` in
  `tofu/cloud-init/`, because something has to tell ArgoCD where Git is.

  Anything under `k8s/` is deployed by being pushed. Applying it with `kubectl` gets the
  right result for the wrong reason and conceals whether reconciliation works at all.

  ## Chosen stack

  OpenTofu (`tofu`, Terraform-compatible) with the `bpg/proxmox` provider, k3s for
  Kubernetes, ArgoCD for GitOps, GitHub as the remote. Cloud-init handles node
  bootstrap.

  There is deliberately no configuration-management layer. Nodes are immutable and
  disposable: cloud-init does bootstrap, everything above the OS is declared in Git and
  reconciled by ArgoCD. Do not reintroduce Ansible without an explicit decision — an
  earlier attempt in `../ansible/` is superseded, not a pattern to follow.

  ## How to structure work

  Two previous attempts at this project stalled — not on a technical wall, but because
  they were structured layer-by-layer (Terraform, then Ansible, then Kubernetes) and
  produced nothing observable until the final layer. The operator has ~10 hours a week.

  Consequently: scope every change as a thin end-to-end slice that ends in something
  demonstrable — a URL that serves, a command that returns, a rebuild that completes.
  One change per milestone, never one change per layer. A change named
  `serve-site-from-k3s` is correctly scoped; one named `add-terraform-layer` is not.

  Prefer a working ugly slice over a correct partial layer. Name rabbit holes and skip
  them explicitly, on the record, rather than doing them properly up front — hand-built
  VM templates, scoped Proxmox API roles, and remote state backends are all deferred by
  deliberate decision, not oversight. Refactoring working infrastructure later is both
  the better learning exercise and the safer use of limited time.

  ## Safety

  This repo manages real hardware running a live tunnel. Never run `tofu apply`,
  `kubectl apply`, `helm upgrade`, or a destructive `pct`/`qm` command unless the
  operator explicitly asks. Produce a plan or diff (`tofu plan`, `--dry-run=client`)
  and let the operator run the apply.

  Credentials are scoped, and the scoping is asserted rather than described: run
  `make check-privileges`. OpenTofu provisions as `terraform@pve!tofu` with privilege
  separation on and a custom nineteen-privilege role; `root@pam` holds no API tokens.
  Cloud-init snippets upload as the unprivileged `tofu-snippets`, which is why root SSH
  could be withdrawn — `PermitRootLogin no`, and root's authorised keys removed. The
  tunnel runs as `cloudflared` with its token in a mode-600 file read via `--token-file`,
  so it appears in neither `argv` nor the environment.

  Storage of secrets is still a separate, unsolved problem from their scope: they are
  files on disk, not held in a manager. Never commit credentials, kubeconfigs, tfstate,
  or private keys. Never write an administrative token into `tofu/terraform.tfvars` —
  that file is the scoped credential, and widening it would be invisible.

