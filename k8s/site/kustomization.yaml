apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# The generator appends a hash of the content to the ConfigMap's name, and rewrites the
# Deployment's reference to match. Editing a page therefore changes the pod spec, which
# rolls the pods — so a push actually redeploys.
#
# A hand-written ConfigMap updates in place. The Deployment would not change, the pods
# would not restart, and the old content would keep being served from the already-mounted
# volume until something unrelated caused a restart. The demonstration would appear to
# work and then intermittently not.
configMapGenerator:
  - name: site-content
    files:
      - content/index.html
      # No binary assets here. kustomize will base64 a binary file into binaryData
      # and nginx will serve it, but ArgoCD's client-side apply writes the whole
      # object into the last-applied-configuration annotation, which is capped at
      # 256 KiB. Past that the ConfigMap is rejected while the Deployment applies
      # anyway, so the new pod waits on a ConfigMap that never appears and the old
      # pod keeps serving — a wedged deploy that looks like a healthy site.
      # asa-norte.jpg (223 KB, 309 KB encoded) hit exactly this. It is still in
      # content/ but unserved; see check-configmap-size for the ceiling.
